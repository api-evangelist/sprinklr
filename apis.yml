  reason: covered
  detail: >-
    Sprinklr's developer portal is an Angular SPA, but its Apigee liveportal
    JSON API served all 18 documentation pages anonymously, which yielded real
    published rate limits, an error catalogue, the OAuth model, the webhook
    catalogue and a quarterly changelog. No OpenAPI exists — the portal's 20
    Apigee API products all return 404 on their spec snapshot.
