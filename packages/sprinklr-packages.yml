mobile_sdks:
  note: >-
    dev.sprinklr.com/sdks documents Live Chat, Headless Live Chat and CFM SDKs
    for web, iOS and Android, but publishes no public registry coordinate
    (no CocoaPods pod, no Maven Central groupId, no distribution URL) for any of
    them; they are delivered to licensed customers. Recorded in
    components/sprinklr-components.yml, not here.
