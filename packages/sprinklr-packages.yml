generated: '2026-08-12'
method: searched
source: >-
  https://registry.npmjs.org (scope search + per-package metadata),
  https://github.com/sprinklr-inc, https://dev.sprinklr.com/sdks
note: >-
  Sprinklr ships no server-side REST client library in any language. There is no
  Sprinklr package on PyPI, RubyGems, crates.io or Packagist, and the GitHub org
  github.com/sprinklr-inc holds only five repos, none of which is a REST SDK.
  What Sprinklr does publish is a browser/embed-side JavaScript family under the
  @sprinklrjs npm scope, tied to the "Sprinklr Apps" extensibility model and the
  Live Chat / CFM embeds documented at dev.sprinklr.com/sdks. First-party is
  established by github.com/sprinklr-inc/create-sprinklr-app, which is the
  source repo for @sprinklrjs/create-sprinklr-app. Every one of these packages
  is stale relative to the API it wraps: the newest release is 2025-11-26 and
  three of the four last shipped in 2022 or 2024, while the REST API changelog
  was still adding endpoints in Q1 2026.
registries_checked:
  - {registry: npm, result: 4 first-party packages under @sprinklrjs}
  - {registry: pypi, result: none, probe: 'https://pypi.org/pypi/sprinklr/json -> 404'}
  - {registry: rubygems, result: none}
  - {registry: crates.io, result: none}
  - {registry: packagist, result: none}
  - {registry: maven-central, result: 'none first-party; sprinklr-inc/twitter4j-ads is a Twitter4J fork, not a Sprinklr API client'}
  - {registry: nuget, result: none}
  - {registry: pkg.go.dev, result: none}
