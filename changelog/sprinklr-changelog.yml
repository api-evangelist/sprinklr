entries:
  - period: 'Jan – Mar, 2026'
    url: https://dev.sprinklr.com/jan-mar-2026
    breaking: []
    additions:
      - 'Create Custom Entity - Bulk API: bulk-insert multiple records for a custom entity in one request.'
      - 'Bulk Update User Profiles API: identify and update multiple user profiles in one request by channel details or profile IDs.'
    changes:
      - 'Search by Entity API now supports PROFILE searches by phone number and email ID.'
      - 'Partial Update User API now supports dot notation for nested attributes (e.g. name.familyName).'
      - 'Agent Status Update API now accepts External User Identifiers (externalId) to identify agents.'
      - 'WhatsApp Dynamic Templates API now supports GEO_LOCATION as an attachment type (latitude, longitude, name, address).'
  - period: 'Oct – Dec, 2025'
    url: https://dev.sprinklr.com/oct-dec-2025
    breaking: []
    additions:
      - 'Partial Update User (SCIM) API: PATCH a subset of user attributes without replacing the record; follows the SCIM 2.0 PATCH standard with add and replace operations over name, active, locale, emails, client attributes and custom properties.'
      - 'CFM Transaction APIs: manage transactions capturing customer interaction data for triggering personalized surveys.'
      - 'Generate Personalized Survey Links API.'
      - 'Preview Outbound Post API: generate and download previews of outbound posts before publishing.'
  - period: 'Jul – Sep, 2025'
    url: https://dev.sprinklr.com/jul-sep-2025
    breaking: []
    additions:
      - 'Advertising APIs (Ads Publishing): channel-agnostic create/manage/publish across Facebook, Instagram, LinkedIn and X — 23 endpoints including Fetch Ad User Accounts, Fetch Campaigns, Fetch Ad Sets, Fetch Ad Variants, Fetch Audience Metadata, Fetch Ad Pixels, Create/Update Ad Campaigns and Ad Sets.'
      - 'Voice Application APIs: Create Voice Application, Update Voice Application.'
      - 'Business Hours and Holiday Lists APIs: create, retrieve, update and delete business-hours configurations and holiday lists.'
      - 'CFM Survey Response Webhook.'
      - 'Voice Call Quality Metrics Webhook: participant details, call identifiers and real-time MOS, jitter, packet loss, round-trip time and network speed.'
      - 'Business Hours and Business Holiday Lists Webhooks.'
      - 'CFM Transaction APIs.'
      - 'Preview Outbound Post API.'
