  security.txt, PGP-signed, whose Expires field (2026-01-01) is already in the
  past. api3.sprinklr.com (the API host) returns a hard 404 on every
  /.well-known path. dev.sprinklr.com is an Angular single-page developer
  portal whose catch-all answers HTTP 200 with the SPA HTML shell for EVERY
  /.well-known path, so none of its 200s are documents; they are recorded as
  misses. No agent card, no OIDC discovery, no OAuth authorization-server
  metadata and no api-catalog is published on any host.
